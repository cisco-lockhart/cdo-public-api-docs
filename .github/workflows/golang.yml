name: build OpenAPI docs generation tool
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - scripts/golang/**
  pull_request:
    branches: [ master, main ]
    paths:
      - scripts/golang/**
      - .github/workflows/golang.yml
      - .releaserc.json
      - package.json
      - package-lock.json
      - sdk-templates/python/github-workflow.mustache

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: scripts/golang/go.sum

      - name: Install dependencies
        working-directory: scripts/golang
        run: |
          go mod tidy
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.22.2

      - name: Run tests
        working-directory: scripts/golang
        run: |
          ginkgo -r -v

      - name: Build Snapshots using Goreleaser
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: release --snapshot
          workdir: 'scripts/golang'

      - name: Archive Snapshots
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: dist-snapshots
          path: scripts/golang/dist/*.tar.gz

  tag:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Calculate version and push tag
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: scripts/golang/go.sum

      - name: Build using Goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: release
          workdir: 'scripts/golang'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: ${{ vars.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
